<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morris | QA Automation Engineer</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Poppins:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Noto Sans TC', 'Poppins', sans-serif;
            color: #ffffff;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease;
        }

        .profile-card:hover {
            transform: translateY(-10px);
        }

        .avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin: 0;
            font-size: 2.2em;
            letter-spacing: 2px;
        }

        h2 {
            margin: 10px 0 20px;
            font-size: 1.1em;
            color: #a8c0ff;
            font-weight: 400;
        }

        p.description {
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .skill-tag {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: default;
        }

        .skill-tag:hover {
            background: #4facfe;
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
    </style>
</head>

<body>
    <div class="profile-card" id="main-card">
        <div class="avatar">M</div>
        <h1 id="user-name">Morris</h1>
        <h2 id="job-title">Python 開發者 ✖ QA 自動化架構師</h2>
        <p class="description">
            致力於將繁瑣的測試流程自動化。<br>
            專注於構建穩健的軟體品質防線，讓開發團隊能安心交付每一個版本。
        </p>
        <div class="skills-container" id="skill-list">
            <span class="skill-tag">Python 3</span>
            <span class="skill-tag">Selenium</span>
            <span class="skill-tag">Playwright</span>
            <span class="skill-tag">Pytest</span>
            <span class="skill-tag">API 測試</span>
        </div>
    </div>
</body>

</html>
